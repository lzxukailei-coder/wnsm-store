name: 定时爬取八方报价

on:
  # 北京时间 08:00 和 15:00（UTC 00:00 和 07:00）
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 7 * * *'
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖（验证码识别 + 图像处理）
        run: npm ci

      - name: 运行爬虫（公开价 + 登录会员价）
        env:
          BF_USER: ${{ secrets.BF_USER }}
          BF_PASS: ${{ secrets.BF_PASS }}
        run: node crawler.js

      - name: 检查数据变化
        id: git-check
        run: |
          if git diff --quiet data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "数据没有变化"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "数据有更新"
          fi

      - name: 提交数据
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore: 自动更新报价 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: 触发 Cloudflare 部署
        if: steps.git-check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -s -o dispatch-response.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "deploy dispatch HTTP $status"
          if [ "$status" != "204" ]; then
            cat dispatch-response.json
            exit 1
          fi
