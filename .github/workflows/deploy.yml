name: 部署到 Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 诊断 Cloudflare Token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== 出口IP ==="
          curl -s https://api.cloudflare.com/cdn-cgi/trace | grep '^ip='
          echo "=== /user (User Details) ==="
          curl -s "https://api.cloudflare.com/client/v4/user" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | head -c 300
          echo ""
          echo "=== /accounts (Account Settings) ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | head -c 400
          echo ""
          echo "=== Secret里的AccountID长度 ==="
          echo -n "$CLOUDFLARE_ACCOUNT_ID" | wc -c
          echo "=== 硬编码AccountID访问Pages ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/ad94869d77670dd16e2e8ef60a636724/pages/projects" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | head -c 300
          echo ""

      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=wnsm-store --branch=main
