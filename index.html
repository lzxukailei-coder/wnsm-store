<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>wnsm.store - 手机渠道报价</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#1d1d1f;padding-bottom:80px}
/* 顶部 */
.header{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center}
.header .logo{font-size:17px;font-weight:700;letter-spacing:.5px}
.header .logo span{color:#ffd700}
.header .user-area{display:flex;align-items:center;gap:10px}
.header .user-btn{font-size:13px;color:#fff;background:rgba(255,255,255,.15);border:none;padding:6px 14px;border-radius:16px;cursor:pointer}
.header .user-btn.admin{background:#ffd700;color:#1a1a2e;font-weight:600}
.header .user-info{font-size:12px;color:#ccc}
/* 搜索 */
.search-bar{background:#fff;padding:10px 16px 6px;border-bottom:1px solid #f0f0f3}
.search-bar input{width:100%;padding:9px 14px;border:1px solid #d2d2d7;border-radius:10px;font-size:14px;outline:none;background:#f5f5f7}
.search-bar input:focus{border-color:#0071e3;background:#fff}
.update-line{font-size:11px;color:#86868b;padding:4px 2px 0}
/* 筛选标签通用 */
.filter-bar{display:flex;gap:8px;padding:8px 16px;overflow-x:auto;background:#fff;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.filter-btn{padding:6px 14px;border-radius:16px;background:#f5f5f7;font-size:13px;white-space:nowrap;cursor:pointer;border:none;color:#333}
.filter-btn.active{background:#0071e3;color:#fff}
.type-bar{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;background:#fff;border-bottom:1px solid #e5e5ea;scrollbar-width:none}
.type-bar::-webkit-scrollbar{display:none}
.ch-btn{padding:5px 11px;border-radius:14px;background:none;font-size:12px;white-space:nowrap;cursor:pointer;border:1px solid #d2d2d7;color:#666}
.ch-btn.active{background:#fff3e0;color:#f57c00;border-color:#f57c00}
/* 品牌标题 */
.brand-title{padding:10px 16px 6px;font-size:14px;font-weight:600;color:#1d1d1f;background:#f5f5f7;display:flex;justify-content:space-between;align-items:center;position:sticky;top:104px;z-index:50}
.brand-title .count{font-size:12px;font-weight:400;color:#86868b}
/* 产品卡片 */
.card{background:#fff;margin:8px 12px;border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card .name{font-size:14px;font-weight:500;line-height:1.4;margin-bottom:6px}
.card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.card .price-box{display:flex;align-items:baseline;gap:6px}
.card .price{font-size:22px;font-weight:700;color:#ff3b30}
.card .price.cny{font-size:13px;font-weight:400}
.card .price-tag{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:500}
.tag-c{background:#e3f2fd;color:#1976d2}
.tag-b{background:#fce4ec;color:#c2185b}
.tag-p{background:#fff8e1;color:#f9a825}
.card .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.card .tags span{font-size:10px;padding:2px 7px;border-radius:4px}
.t-original{background:#e3f2fd;color:#1976d2}
.t-activated{background:#fff3e0;color:#f57c00}
.t-national{background:#e8f5e9;color:#388e3c}
.t-out{background:#ffebee;color:#d32f2f}
.buy-btn{background:linear-gradient(135deg,#0071e3,#0056b3);color:#fff;border:none;padding:8px 18px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer}
.buy-btn:disabled{background:#ccc}
.price-locked{font-size:13px;color:#86868b}
.login-hint{background:#0071e3;color:#fff;border:none;padding:8px 16px;border-radius:10px;font-size:13px;cursor:pointer}
.empty{text-align:center;padding:60px 20px;color:#86868b;font-size:14px}
.load-more{display:block;margin:16px auto 24px;padding:10px 36px;background:#fff;border:1px solid #d2d2d7;border-radius:20px;font-size:14px;color:#0071e3;cursor:pointer}
/* 弹窗 */
.modal-mask{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;justify-content:center;align-items:center}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:16px;width:88%;max-width:360px;padding:24px;animation:slideUp .25s ease;max-height:90vh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal h2{font-size:18px;text-align:center;margin-bottom:20px}
.modal .tab-row{display:flex;margin-bottom:20px;background:#f5f5f7;border-radius:10px;padding:3px}
.modal .tab{flex:1;text-align:center;padding:8px;font-size:14px;border-radius:8px;cursor:pointer;color:#666}
.modal .tab.active{background:#fff;color:#0071e3;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.modal .field{margin-bottom:14px}
.modal .field label{font-size:12px;color:#86868b;display:block;margin-bottom:5px}
.modal .field input,.modal .field select{width:100%;padding:10px 12px;border:1px solid #d2d2d7;border-radius:8px;font-size:14px;outline:none}
.modal .field input:focus,.modal .field select:focus{border-color:#0071e3}
.modal .submit{width:100%;background:#0071e3;color:#fff;border:none;padding:12px;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer}
.modal .submit:disabled{background:#9ec9f5;cursor:wait}
.modal .close{text-align:center;margin-top:14px;font-size:13px;color:#86868b;cursor:pointer}
.modal .tip{font-size:11px;color:#86868b;text-align:center;margin-top:10px;line-height:1.5}
/* 底部导航 */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e5ea;display:flex;z-index:100}
.nav-item{flex:1;text-align:center;padding:8px 0;font-size:11px;color:#86868b;cursor:pointer}
.nav-item.active{color:#0071e3}
.nav-item .icon{font-size:20px;display:block;margin-bottom:2px}
</style>
</head>
<body>

<div class="header">
  <div class="logo">wnsm<span>.store</span></div>
  <div class="user-area" id="userArea">
    <button class="user-btn" onclick="openModal('login')">登录/注册</button>
  </div>
</div>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="搜索型号，如：18Pro 256 黑 / Mate70 / 平板">
  <div class="update-line" id="updateLine">正在加载报价…</div>
</div>

<!-- 品牌筛选 -->
<div class="filter-bar" id="brandFilter">
  <button class="filter-btn active" data-brand="all">全部</button>
  <button class="filter-btn" data-brand="apple">苹果</button>
  <button class="filter-btn" data-brand="huawei">华为</button>
  <button class="filter-btn" data-brand="honor">荣耀</button>
  <button class="filter-btn" data-brand="xiaomi">小米</button>
  <button class="filter-btn" data-brand="vivo">VIVO</button>
  <button class="filter-btn" data-brand="oppo">OPPO/一加</button>
  <button class="filter-btn" data-brand="samsung">三星</button>
  <button class="filter-btn" data-brand="motorola">摩托罗拉</button>
  <button class="filter-btn" data-brand="dji">大疆</button>
  <button class="filter-btn" data-brand="other">其他</button>
</div>

<!-- 品类筛选 -->
<div class="filter-bar" id="typeFilter" style="padding-top:0;padding-bottom:4px">
  <button class="filter-btn active" data-type="all" style="background:#eef4ff;font-size:12px">全部</button>
  <button class="filter-btn" data-type="phone" style="background:#eef4ff;font-size:12px">手机</button>
  <button class="filter-btn" data-type="tablet" style="background:#eef4ff;font-size:12px">平板</button>
  <button class="filter-btn" data-type="watch" style="background:#eef4ff;font-size:12px">手表/穿戴</button>
  <button class="filter-btn" data-type="audio" style="background:#eef4ff;font-size:12px">耳机/音响</button>
  <button class="filter-btn" data-type="computer" style="background:#eef4ff;font-size:12px">电脑</button>
  <button class="filter-btn" data-type="accessory" style="background:#eef4ff;font-size:12px">配件</button>
  <button class="filter-btn" data-type="smart" style="background:#eef4ff;font-size:12px">智能/生态</button>
</div>

<!-- 渠道筛选 -->
<div class="type-bar" id="channelFilter">
  <button class="ch-btn active" data-ch="all">全部渠道</button>
  <button class="ch-btn" data-ch="官网">官网</button>
  <button class="ch-btn" data-ch="*">原封</button>
  <button class="ch-btn" data-ch="兰州激活">兰州激活</button>
  <button class="ch-btn" data-ch="仅激活">仅激活</button>
  <button class="ch-btn" data-ch="国补">国补</button>
</div>

<div id="productList"></div>
<div class="empty" id="emptyState" style="display:none">没有找到匹配的型号</div>
<button class="load-more" id="loadMoreBtn" style="display:none" onclick="loadMore()">加载更多 ↓</button>

<!-- 登录/注册弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="tab-row">
      <div class="tab active" data-tab="login" onclick="switchTab('login')">登录</div>
      <div class="tab" data-tab="register" onclick="switchTab('register')">注册</div>
    </div>

    <div id="loginForm">
      <div class="field">
        <label>手机号</label>
        <input type="tel" id="loginPhone" placeholder="请输入手机号" maxlength="11">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="loginPassword" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="submit" id="loginBtn" onclick="doLogin()">登录</button>
    </div>

    <div id="registerForm" style="display:none">
      <div class="field">
        <label>手机号</label>
        <input type="tel" id="regPhone" placeholder="请输入手机号" maxlength="11">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="regPassword" placeholder="设置6-20位密码">
      </div>
      <div class="field">
        <label>客户类型</label>
        <select id="regRole" onchange="toggleBizFields()">
          <option value="C">个人客户（零售价）</option>
          <option value="B">同行/渠道商（批发价）</option>
        </select>
      </div>
      <div id="bizFields" style="display:none">
        <div class="field">
          <label>公司/门店名称</label>
          <input type="text" id="regCompany" placeholder="如：兰州XX通讯器材经营部">
        </div>
        <div class="field">
          <label>联系人</label>
          <input type="text" id="regContact" placeholder="联系人姓名/微信">
        </div>
        <div class="field">
          <label>营业执照编号</label>
          <input type="text" id="regLicense" placeholder="统一社会信用代码">
        </div>
      </div>
      <button class="submit" id="regBtn" onclick="doRegister()">注册</button>
      <div class="tip" id="regTip">同行注册后需提交资质审核，审核通过后显示批发价</div>
    </div>

    <div class="close" onclick="closeModal()">关闭</div>
  </div>
</div>

<!-- 底部导航 -->
<div class="bottom-nav">
  <div class="nav-item active"><span class="icon">🏠</span>报价</div>
  <div class="nav-item"><span class="icon">🔍</span>分类</div>
  <div class="nav-item"><span class="icon">🛒</span>购物车</div>
  <div class="nav-item" onclick="goMe()"><span class="icon">👤</span>我的</div>
</div>

<script>
let products = [];
let user = null;
let currentBrand = 'all';
let currentType = 'all';
let currentChannel = 'all';
let displayCount = 60;
const PAGE = 60;

const BRAND_ORDER = ['apple','huawei','honor','xiaomi','vivo','oppo','samsung','motorola','dji','nokia','xiaodu','skg','baihe','andun','edu','other'];
const BRAND_NAMES = {
  apple:'苹果', huawei:'华为', honor:'荣耀', xiaomi:'小米', vivo:'VIVO',
  oppo:'OPPO/一加', samsung:'三星', motorola:'摩托罗拉', dji:'大疆',
  nokia:'诺基亚', xiaodu:'小度', skg:'SKG', baihe:'百合', andun:'安顿',
  edu:'学习设备', other:'其他'
};

// 统一 API 请求（同源自动携带 httpOnly Cookie）
async function api(path, method = 'GET', body) {
  const opt = { method, credentials: 'same-origin', headers: {} };
  if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  const data = await r.json().catch(() => ({}));
  if (!r.ok || data.ok === false) throw new Error(data.error || '请求失败，请稍后重试');
  return data;
}

// 加载商品（服务端按身份返回展示价）
async function loadProducts() {
  try {
    const data = await api('/api/products');
    products = data.products || [];
    if (data.auth) user = data.auth;
    document.getElementById('updateLine').textContent =
      '报价更新：' + (data.updateTime || '未知') + ' · 共 ' + products.length + ' 个型号';
    updateUserArea();
    render();
  } catch (e) {
    document.getElementById('updateLine').textContent = '报价加载失败：' + e.message;
  }
}

// 启动：先用 /me 恢复登录态，再加载商品
(async function init() {
  try {
    const me = await api('/api/me');
    user = me.user;
  } catch (e) { user = null; }
  updateUserArea();
  await loadProducts();
})();

document.getElementById('searchInput').addEventListener('input', () => { displayCount = PAGE; render(); });

document.getElementById('brandFilter').addEventListener('click', e => {
  if (!e.target.classList.contains('filter-btn')) return;
  document.querySelectorAll('#brandFilter .filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  currentBrand = e.target.dataset.brand;
  displayCount = PAGE;
  render();
});

document.getElementById('typeFilter').addEventListener('click', e => {
  if (!e.target.classList.contains('filter-btn')) return;
  document.querySelectorAll('#typeFilter .filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  currentType = e.target.dataset.type;
  displayCount = PAGE;
  render();
});

document.getElementById('channelFilter').addEventListener('click', e => {
  if (!e.target.classList.contains('ch-btn')) return;
  document.querySelectorAll('.ch-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  currentChannel = e.target.dataset.ch;
  displayCount = PAGE;
  render();
});

function loadMore() { displayCount += PAGE; render(); }

function getFiltered() {
  const kw = document.getElementById('searchInput').value.toLowerCase().trim();
  let list = products.filter(p => {
    if (currentBrand !== 'all') {
      if (currentBrand === 'other') {
        if (['apple','huawei','honor','xiaomi','vivo','oppo','samsung','motorola','dji'].includes(p.brand)) return false;
      } else if (p.brand !== currentBrand) return false;
    }
    if (currentType !== 'all' && p.ptype !== currentType) return false;
    if (currentChannel !== 'all' && p.channel !== currentChannel) return false;
    if (kw && !(p.name.toLowerCase().includes(kw) || (p.sku||'').toLowerCase().includes(kw) || (p.category||'').toLowerCase().includes(kw))) return false;
    return true;
  });
  list.sort((a, b) => {
    const ba = BRAND_ORDER.indexOf(a.brand), bb = BRAND_ORDER.indexOf(b.brand);
    if (ba !== bb) return (ba === -1 ? 99 : ba) - (bb === -1 ? 99 : bb);
    return (a.displayPrice ?? Infinity) - (b.displayPrice ?? Infinity);
  });
  return list;
}

function render() {
  const list = getFiltered();
  const box = document.getElementById('productList');
  const empty = document.getElementById('emptyState');
  const moreBtn = document.getElementById('loadMoreBtn');
  if (!list.length) { box.innerHTML = ''; empty.style.display = 'block'; moreBtn.style.display = 'none'; return; }
  empty.style.display = 'none';

  const totalByBrand = {};
  list.forEach(p => totalByBrand[p.brand] = (totalByBrand[p.brand] || 0) + 1);

  const shown = list.slice(0, displayCount);
  let html = '';
  let lastBrand = null;
  shown.forEach(p => {
    if (p.brand !== lastBrand) {
      html += `<div class="brand-title">${BRAND_NAMES[p.brand] || p.brand}<span class="count">${totalByBrand[p.brand]} 个型号</span></div>`;
      lastBrand = p.brand;
    }
    html += renderCard(p);
  });
  box.innerHTML = html;
  moreBtn.style.display = list.length > displayCount ? 'block' : 'none';
  moreBtn.textContent = `加载更多（还有 ${list.length - displayCount} 个）↓`;
}

function renderCard(p) {
  const tags = (p.tags || []).map(t => {
    const cls = { '原封':'t-original','激活':'t-activated','国补':'t-national','缺货':'t-out' }[t] || 't-original';
    return `<span class="${cls}">${t}</span>`;
  }).join('');

  let priceHtml = '', priceTag = '';
  if (p.outStock) {
    priceHtml = `<span style="font-size:15px;color:#86868b">缺货/待报价</span>`;
  } else if (!user || p.displayPrice == null) {
    priceHtml = `<span class="price-locked">🔒 登录后查看价格</span>`;
  } else {
    priceHtml = `<span class="price cny">￥</span><span class="price">${Number(p.displayPrice).toLocaleString()}</span>`;
    if (p.priceLabel === 'wholesale') priceTag = `<span class="price-tag tag-b">批发价</span>`;
    else if (p.priceLabel === 'pending') priceTag = `<span class="price-tag tag-p">审核中·零售价</span>`;
    else priceTag = `<span class="price-tag tag-c">零售价</span>`;
  }

  const btn = p.outStock
    ? `<button class="buy-btn" disabled>缺货</button>`
    : user
      ? `<button class="buy-btn" onclick="buy('${encodeURIComponent(p.name)}')">咨询</button>`
      : `<button class="login-hint" onclick="openModal('login')">登录购买</button>`;

  return `
    <div class="card">
      <div class="name">${p.name}</div>
      <div class="meta">
        <div class="price-box">${priceHtml}${priceTag}</div>
        ${btn}
      </div>
      <div class="tags">${tags}</div>
    </div>`;
}

function openModal(type) {
  document.getElementById('modalMask').classList.add('show');
  switchTab(type);
}
function closeModal() { document.getElementById('modalMask').classList.remove('show'); }
function switchTab(type) {
  document.querySelectorAll('.modal .tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.modal .tab[data-tab="${type}"]`).classList.add('active');
  document.getElementById('loginForm').style.display = type === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = type === 'register' ? 'block' : 'none';
}
function toggleBizFields() {
  document.getElementById('bizFields').style.display =
    document.getElementById('regRole').value === 'B' ? 'block' : 'none';
}

async function doRegister() {
  const phone = document.getElementById('regPhone').value.trim();
  const password = document.getElementById('regPassword').value;
  const role = document.getElementById('regRole').value;
  if (!/^1\d{10}$/.test(phone)) { alert('请输入正确的手机号'); return; }
  if (password.length < 6) { alert('密码至少 6 位'); return; }
  const payload = { phone, password, role };
  if (role === 'B') {
    payload.company = document.getElementById('regCompany').value.trim();
    payload.contact = document.getElementById('regContact').value.trim();
    payload.businessLicense = document.getElementById('regLicense').value.trim();
    if (!payload.company) { alert('请填写公司/门店名称'); return; }
  }
  const btn = document.getElementById('regBtn');
  btn.disabled = true; btn.textContent = '提交中…';
  try {
    const r = await api('/api/register', 'POST', payload);
    user = r.user;
    updateUserArea(); closeModal();
    await loadProducts();
    alert(r.message || '注册成功');
  } catch (e) {
    alert(e.message);
  } finally {
    btn.disabled = false; btn.textContent = '注册';
  }
}

async function doLogin() {
  const phone = document.getElementById('loginPhone').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!phone || !password) { alert('请输入手机号和密码'); return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = '登录中…';
  try {
    const r = await api('/api/login', 'POST', { phone, password });
    user = r.user;
    updateUserArea(); closeModal();
    await loadProducts();
  } catch (e) {
    alert(e.message);
  } finally {
    btn.disabled = false; btn.textContent = '登录';
  }
}

async function logout() {
  await api('/api/logout', 'POST').catch(() => {});
  user = null;
  updateUserArea();
  await loadProducts();
}

function maskPhone(p) { return p ? p.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2') : ''; }

function updateUserArea() {
  const area = document.getElementById('userArea');
  if (!user) {
    area.innerHTML = `<button class="user-btn" onclick="openModal('login')">登录/注册</button>`;
    return;
  }
  let label = '';
  if (user.role === 'admin') label = '管理员';
  else if (user.role === 'B') label = user.status === 'approved' ? 'B端·批发价' : (user.status === 'pending' ? 'B端·审核中' : 'B端·未通过');
  else label = 'C端·零售价';
  const adminBtn = user.role === 'admin'
    ? `<button class="user-btn admin" onclick="location.href='/admin.html'">审核后台</button>` : '';
  area.innerHTML = `
    <span class="user-info">${maskPhone(user.phone)} ${label}</span>
    ${adminBtn}
    <button class="user-btn" onclick="logout()">退出</button>`;
}

function goMe() { if (user) { alert('当前账号：' + user.phone + '\n类型：' + (user.role === 'B' ? '同行' : '个人客户')); } else { openModal('login'); } }

function buy(nameEnc) {
  const name = decodeURIComponent(nameEnc);
  const text = `你好，我想咨询：${name}`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text);
    alert('咨询内容已复制，请粘贴到微信/客服对话框');
  }
}
</script>
</body>
</html>
